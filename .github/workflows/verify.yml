name: verify

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: mobile-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate documentation repository
        run: node scripts/validate-repository.mjs
      - name: Validate YAML
        run: |
          ruby -ryaml -e 'Dir[".github/**/*.yml", ".github/**/*.yaml"].each { |file| YAML.safe_load_file(file, aliases: true) }'
      - name: Validate Conventional Commits
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git log --format=%s "origin/${GITHUB_BASE_REF}..${GITHUB_SHA}" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?: .+' || {
              echo "Invalid Conventional Commit: $subject"
              exit 1
            }
          done
      - name: Validate working-tree whitespace
        run: git diff --check

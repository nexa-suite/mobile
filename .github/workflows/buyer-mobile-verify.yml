name: Nexa Buyer Flutter verification

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      buyer: ${{ steps.filter.outputs.buyer }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            buyer:
              - 'apps/buyer-mobile/**'
              - '.github/**'
              - 'AGENTS.md'

  buyer-quality:
    needs: changes
    if: needs.changes.outputs.buyer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/buyer-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Flutter stable
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: 3.47.7
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Build debug APK
        run: flutter build apk --debug --no-pub --dart-define=NEXA_API_BASE_URL=https://api.example.test

  verify:
    if: always()
    needs:
      - changes
      - buyer-quality
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable Buyer verification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUYER_CHANGED: ${{ needs.changes.outputs.buyer }}
          BUYER_RESULT: ${{ needs.buyer-quality.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if test "$BUYER_CHANGED" = true; then
            test "$BUYER_RESULT" = success
          fi
